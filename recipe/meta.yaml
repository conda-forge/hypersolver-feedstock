{% set name = "hypersolver" %}
{% set version = "0.0.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/hypersolver-{{ version }}.tar.gz
  sha256: 6e0ecbf7c49d97a9979886aa00d9d38dc2b020cd8f2f4f8dbdd3bb101eff190b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - flit-core >=3.2,<4
    - pip
    - python {{ python_min }}
  run:
    - numpy
    - python >={{ python_min }}
    - scipy

test:
  imports:
    - hypersolver
  source_files:
    - hypersolver
  commands:
    - pip check
    - pytest
  requires:
    - pip
    - pytest
    - python {{ python_min }}

about:
  home: https://pypi.org/project/hypersolver/
  summary: hyper(bolic partial differential equations)solver
  license: MIT
  license_file:
    - license

extra:
  recipe-maintainers:
    - ngam
